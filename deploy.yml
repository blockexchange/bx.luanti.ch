---
- hosts: all
  remote_user: root
  become: yes
  become_method: sudo
  vars:
    compose_directory: /data/bx.luanti.ch
  tasks:
    - name: Copy config files
      template:
        src: "{{item}}"
        dest: "{{compose_directory}}/{{item}}"
      with_items:
        - "docker-compose.yml"
        - "blockexchange.env"
        - "redirect.conf"

    - name: Pull latest images
      shell:
        cmd: "docker compose pull"
        chdir: "{{ compose_directory }}"
  
    - name: Rolling update of the web service (waits for healthy containers)
      shell:
        cmd: "docker rollout -f docker-compose.yml blockexchange"
        chdir: "{{ compose_directory }}"

    - name: Update worker and auxilliary services
      shell:
        cmd: "docker compose up -d --remove-orphans"
        chdir: "{{ compose_directory }}"
