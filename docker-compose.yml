services:
 blockexchange:
  image: blockexchange/blockexchange
  restart: always
  # no container_name / host ports: required for "docker rollout"
  depends_on:
   - postgres
  env_file:
   - blockexchange.env
  environment:
   - WASM_PACK_CACHE_DIR=/data/wasm-packs
  volumes:
   - "./data/wasm-packs:/data/wasm-packs"
  deploy:
   replicas: 1
  healthcheck:
   # fails as soon as /tmp/draining exists (set by the pre-stop hook below)
   test: ["CMD-SHELL", "test ! -e /tmp/draining && wget -q --spider http://localhost:8080/api/healthcheck || exit 1"]
   interval: 2s
   timeout: 2s
   retries: 2
   start_period: 10s
  stop_grace_period: 20s
  networks:
   - terminator
   - default
  labels:
   # drain: mark unhealthy so traefik stops routing, wait for it to notice, then docker stops the container (SIGTERM + grace period)
   - "docker-rollout.pre-stop-hook=touch /tmp/draining && sleep 10"
   - "traefik.enable=true"
   - "traefik.docker.network=terminator"
   - "traefik.http.routers.bx-luanti-ch.rule=Host(`bx.luanti.ch`)"
   - "traefik.http.services.bx-luanti-ch.loadbalancer.server.port=8080"
   - "traefik.http.routers.bx-luanti-ch.entrypoints=websecure"
   - "traefik.http.routers.bx-luanti-ch.tls.certresolver=default"

 # background jobs, not exposed through traefik
 blockexchange_worker:
  image: blockexchange/blockexchange
  restart: always
  depends_on:
   - postgres
  env_file:
   - blockexchange.env
  environment:
   - EXECUTE_JOBS=true

 # redirects the old domain to the new one
 blockexchange-redirect:
  image: nginx:1.31.9
  restart: always
  networks:
   - terminator
   - default
  labels:
   - "traefik.enable=true"
   - "traefik.docker.network=terminator"
   - "traefik.http.routers.blockexchange-minetest-ch.rule=Host(`blockexchange.minetest.ch`)"
   - "traefik.http.services.blockexchange-minetest-ch.loadbalancer.server.port=80"
   - "traefik.http.routers.blockexchange-minetest-ch.entrypoints=websecure"
   - "traefik.http.routers.blockexchange-minetest-ch.tls.certresolver=default"
  volumes:
   - "./redirect.conf:/etc/nginx/conf.d/default.conf:ro"

 postgres:
  image: postgres:16.6
  restart: always
  shm_size: '2gb'
  environment:
   POSTGRES_PASSWORD: enter
  volumes:
   - "./data/postgres:/var/lib/postgresql/data"
  command:
   - "postgres"
   - "-c"
   - "shared_buffers=4GB"
   - "-c"
   - "synchronous_commit=off"
   - "-c"
   - "max_connections=250"

networks:
 terminator:
  external: true
